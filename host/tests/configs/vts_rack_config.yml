# PARS DUT rack configuration for the RAFT host flow.
# This file is intentionally aligned with the project runtime model used by PARS:
# - DUT is a vDevice
# - generated runtime config is under build/bin/profiles
# - target root on the DUT is /tmp/pars
# - the device config is in the same host/tests/configs folder and is the source of truth

# Data that is global to all tests.
# PARS DUT rack configuration for the RAFT host flow.

globalConfig:
  includes:
    deviceConfig: "vts_deviceConfig.yml"

  local:
    log:
      directory: "./logs"
      delimiter: "/"

