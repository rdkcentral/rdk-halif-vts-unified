# PARS DUT-side VTS device configuration.
# This project uses the generated runtime bundle under build/bin and not repo-local profile copies.
deviceConfig:
  cpe1:
    platform: "vDevice"
    model: "UK"
    soc_vendor: "intel"

    target_directory: "/opt"

    prompt: "#"

    download_path: "bin/assets/streams/input/"
    playback_manual_verification: 0
    test_config_path: "bin/profiles"

    all_wait_time: 2400
    wait_time: 320

    device_type:
      - "TV"

    profile_type: "source"   # source or sink

    boot_non_volatile_directory: "/home/root"
    boot_volatile_directory: "/opt"

    test:
      profile: "bin/profiles/sink/unified_sink_hal_profile.yaml"

      streams_download_url: "https://example.com/streams"

      device_network_list: "/opt/device_list.txt"

      platform_led_config: "bin/profiles/sink/led_config.yaml"

      motionsensor_controller_port: 0
      thermalsensor_controller_port: 0

      deepsleep_controller_port: 8081
      deep_sleep_duration_seconds: 60

    remote:
      deepsleep:
        RCU_IR: 6
        RCU_BT: 7
        RCU_RF4CE: 8